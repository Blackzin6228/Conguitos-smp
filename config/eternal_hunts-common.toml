[features]
	#Enable Mowzie's Mobs dungeon eyes (Wrought Eye, Sun Eye, Frostmaw Eye, Sculptor Eye).
	enableMowzieEyes = false

[soul_armor]
	#Multiplier for Soul Armor defense points (default 1.0).
	# Default: 1.0
	# Range: 0.0 ~ 1000000.0
	armor_multiplier = 1.0
	#Multiplier for Soul Armor toughness (default 1.0).
	# Default: 1.0
	# Range: 0.0 ~ 1000000.0
	toughness_multiplier = 1.0
	#Multiplier for Soul Armor knockback resistance (default 1.0).
	# Default: 1.0
	# Range: 0.0 ~ 1000000.0
	knockback_resistance_multiplier = 1.0
