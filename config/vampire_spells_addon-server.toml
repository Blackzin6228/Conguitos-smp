#Blood spell integration settings
[blood_spells]
	#Minimum mana cost used when mapping mana to blood cost ratios.
	# Default: 20
	# Range: > 0
	bloodCostManaFloor = 20
	#Maximum mana cost used when mapping mana to blood cost ratios.
	# Default: 140
	# Range: > 1
	bloodCostManaCeiling = 140
	#Blood cost ratio applied to spells at or below the mana floor (blood per mana).
	# Default: 0.05
	# Range: 0.0 ~ 5.0
	bloodCostRatioMin = 0.05
	#Blood cost ratio applied to spells at or above the mana ceiling (blood per mana).
	# Default: 0.05
	# Range: 0.0 ~ 5.0
	bloodCostRatioMax = 0.05
	#When true, vampire players always replace mana with blood for spells of the schools in bloodCastingSchools.
	#When false, blood is used only when current mana cannot cover the full mana cost.
	#Ray of Siphoning, creative players, non-mana cast sources, and recasts are excluded.
	alwaysUseBloodForVampireBloodSpells = false
	#Cooldown multiplier for every Blood School spell cast by a vampire player.
	# Default: 0.6666666666666666
	# Range: 0.0 ~ 10.0
	vampireBloodSpellCooldownMultiplier = 0.6666666666666666
	#Mana cost multiplier applied to Devour for vampire players.
	# Default: 2.0
	# Range: 0.0 ~ 10.0
	devourManaMultiplier = 2.0
	#Blood restoration multiplier applied to the Devour spell (relative to damage dealt).
	# Default: 2.0
	# Range: 0.0 ~ 10.0
	devourBloodRestoreMultiplier = 2.0
	#Saturation modifier used when restoring blood with the Devour spell.
	# Default: 0.6
	# Range: 0.0 ~ 5.0
	devourBloodSaturation = 0.6
	#Blood restoration multiplier applied to the Ray of Siphoning spell (relative to damage dealt).
	# Default: 1.0
	# Range: 0.0 ~ 10.0
	rayBloodRestoreMultiplier = 1.0
	#Saturation modifier used when restoring blood with Ray of Siphoning.
	# Default: 0.5
	# Range: 0.0 ~ 5.0
	rayBloodSaturation = 0.5
	#Spell schools whose mana cost vampire players can pay with blood, as described above.
	#Each entry turns one school on; spells of schools that are not listed always use mana.
	#An entry is a school id such as "irons_spellbooks:fire", or just "fire" for an Iron's Spells school.
	#Iron's Spells schools: fire, ice, lightning, holy, ender, blood, evocation, nature, eldritch.
	#Use ["*"] to turn on every school, including schools added by other mods, or [] to turn blood casting off.
	#Example: bloodCastingSchools = ["blood", "fire", "ice"] lets vampires cast Blood, Fire and Ice spells with blood.
	bloodCastingSchools = ["irons_spellbooks:blood"]

#Holy spell integration settings
[holy_spells]
	#When true, holy healing spells (Heal, Greater Heal, Healing Circle, Blessing of Life,
	#Cloud of Regeneration) work as in Iron's Spells: they heal vampire players normally
	#and never damage a vampire caster or a healed vampire.
	#When false, a vampire player who heals someone else and a vampire player who is healed
	#take damage equal to the heal, and the heal on the vampire is cancelled.
	#Holy damage reflection, doubled holy damage to vampire NPCs, and the holy utility
	#spell penalty are not affected.
	disableHolyHealDamage = false
