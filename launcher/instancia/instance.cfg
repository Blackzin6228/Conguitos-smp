[General]
ConfigVersion=1.2
InstanceType=OneSix
name=CONGUITOS SMP
iconKey=conguitos
OverrideCommands=true
PreLaunchCommand="$INST_JAVA" -jar packwiz-installer-bootstrap.jar https://raw.githubusercontent.com/Blackzin6228/Conguitos-smp/main/pack.toml
OverrideMemory=true
MinMemAlloc=1024
MaxMemAlloc=8192
OverrideJavaArgs=true
JvmArgs=-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:InitiatingHeapOccupancyPercent=15
ManagedPack=false
